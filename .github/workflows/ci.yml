# CI for MediPrisma (SMART app side).
#
# Four checks run on every push to master and on every PR:
#   1. typecheck — catches type drift before deploy
#   2. test — runs the Jest suite with --ci flag so any flaky tests fail
#             clearly instead of retrying silently
#   3. lint — enforces code quality and architecture boundaries
#   4. build — full Next static-export build, smoke-tests that the app
#              still compiles end-to-end with all GH-Pages env wiring
#
# gh-pages.yml's `build` job depends on this workflow passing first
# (`needs: ci`), so a red test blocks deploy. Solo-dev master pushes
# without PRs are the default flow here, so gating on push is what
# actually protects production.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
      - "outputs/**"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
      - "outputs/**"
  workflow_dispatch: {}

# Cancel in-flight runs when a newer commit is pushed to the same branch —
# saves CI minutes when iterating quickly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector-compatibility:
    # Only the owner's /app release line; never change pilot/hmc machinery.
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    uses: ./.github/workflows/collector-compatibility.yml
    secrets:
      COLLECTOR_GATEWAY_READ_TOKEN: ${{ secrets.COLLECTOR_GATEWAY_READ_TOKEN }}
    permissions:
      contents: read

  public-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No package token or npm cache: exercise an ordinary public clone.
      - name: Install without private package access
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ""
      - name: Verify optional integrations
        run: |
          npm run test:optional
          node --input-type=module -e "import assert from 'node:assert/strict'; import { detectOptionalPackages } from './scripts/optional-package-state.mjs'; assert.deepEqual(detectOptionalPackages(process.cwd()), { labs: false, care: false, education: false, fhir: false })"
      - name: Public calculator and education regressions
        env:
          TEST_OPTIONAL_EDUCATION: "missing"
        run: npm test -- --ci --runInBand --runTestsByPath __tests__/features/medical-calculator/coded-report-autofill.test.ts __tests__/features/medical-calculator/hfpef-clinical-autofill.test.ts __tests__/features/medical-calculator/echo-paired-velocity.test.ts __tests__/shared/optional-education-content.test.tsx
      - name: Build without private packages or SDK artifact
        env:
          TAILWIND_DISABLE_LIGHTNINGCSS: "true"
        run: |
          rm vendor/nhi-fhir-bridge-sdk-json/browser.js
          npm run typecheck
          npm run build:gh
  gallery-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/checkout@v7
        with:
          repository: MediPrisma/mediprisma-firebase-backend
          ref: e3af56253c816acf3fb704b8d9b25e0f98f4374c
          path: .gallery-backend
      - run: npm ci --prefix .gallery-backend
      - run: npm ci --prefix .gallery-backend/functions
      - run: npx playwright install --with-deps chromium
      - name: Migration and gallery browser regression
        working-directory: .gallery-backend
        run: npx firebase emulators:exec --config firebase.gallery-test.json --only auth,firestore --project demo-mediprisma "node --test tests/prompt-visibility-migration.test.mjs && cd .. && npx playwright test -c playwright.gallery.config.ts"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gallery-regression-results
          path: test-results/
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # One commit of history so the lockfile guard below can compare
          # against the state this push changed.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm install` on macOS drops the optional entries and platform fields
      # that only Linux installs — see scripts/check-lockfile.mjs. `npm ci`
      # below would fail on that, but with an error that points at the symptom
      # rather than the cause, so name it first.
      - name: Lockfile keeps its platform entries
        run: node scripts/check-lockfile.mjs --against HEAD^

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Errors only — warnings are the tracked burn-down backlog
        # (react-hooks compiler rules, unused vars). Boundary rules
        # (core/shared/infrastructure layering) fail as errors.
        run: npm run lint

      - name: Unit tests
        # `--testPathIgnorePatterns="worktrees"` keeps jest from picking up
        # the copies of these tests living under `.claude/worktrees/<branch>/`
        # when developers have Claude Code worktrees checked out locally.
        # All other suites are gated by CI — any new test failure blocks
        # the deploy job below.
        run: npm test -- --ci --passWithNoTests --testPathIgnorePatterns="worktrees"

      - name: Build (smoke test)
        # Same env as the deploy build — catches any GH-Pages-specific
        # config issues (basePath, env wiring) before we attempt deploy.
        # Secrets are inherited from repo settings; failure here means the
        # deploy build would also fail.
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/mediprisma-app"
          TAILWIND_DISABLE_LIGHTNINGCSS: "true"
          NEXT_PUBLIC_CHAT_URL: ${{ secrets.NEXT_PUBLIC_CHAT_URL }}
          NEXT_PUBLIC_WHISPER_URL: ${{ secrets.NEXT_PUBLIC_WHISPER_URL }}
          NEXT_PUBLIC_GEMINI_URL: ${{ secrets.NEXT_PUBLIC_GEMINI_URL }}
          NEXT_PUBLIC_CLAUDE_URL: ${{ secrets.NEXT_PUBLIC_CLAUDE_URL }}
          NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL }}
          NEXT_PUBLIC_PROXY_KEY: ${{ secrets.NEXT_PUBLIC_PROXY_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PERPLEXITY_PROXY_URL: ${{ secrets.NEXT_PUBLIC_PERPLEXITY_PROXY_URL }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ secrets.NEXT_PUBLIC_FEEDBACK_URL }}
        run: npm run build:gh
