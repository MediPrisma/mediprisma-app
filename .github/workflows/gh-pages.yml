name: Deploy to GitHub Pages
# Triggered only after CI succeeds — no separate `push` trigger, so a
# failing test/typecheck/build blocks deploy. The `workflow_dispatch`
# trigger stays for manual re-deploy if needed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run fires on BOTH success and failure of the upstream CI
    # workflow. Skip the deploy unless CI actually passed — otherwise a
    # failed CI run would still trigger an empty deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
      # Serve only redirects so deep links cannot stay on an unconfigured origin.
      - name: Build the Pages redirect
        run: |
          mkdir -p pages
          cp scripts/github-pages-redirect.html pages/index.html
          cp scripts/github-pages-redirect.html pages/404.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
