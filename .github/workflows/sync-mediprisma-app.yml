name: Sync app to mediprisma.tw/app

# Publishes a tested master commit to production (docs/RELEASE-CHANNELS.md).
#
# Two modes, chosen by the repository variable PRODUCTION_PROMOTION:
#   unset / anything else  automatic: every master commit that passes CI goes to
#                          /app at the same time as /app-staging and /app-hmc.
#   manual                 promotion by hand: start this workflow with the commit
#                          live on /app-staging; the `production` environment
#                          then asks for approval.
# Switching modes is a variable change, not a code change.
#
# The build uses the same NEXT_PUBLIC_* settings as before and is pushed into
# the docs site repo (MediPrisma/mediprisma-site) at static/app/, which
# Cloudflare Pages serves as mediprisma.tw/app.
# Publishing uses a write-enabled deploy key stored only in the
# mediprisma-site-publish environment. That environment accepts protected
# branches, so pilot branch workflows cannot read the key.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote (optional; must equal the commit live on mediprisma.tw/app-staging)
        required: false
        type: string

permissions:
  contents: read

# Ineligible workflow_run events (failed CI, pull requests, manual mode) get a
# group of their own so they never queue behind or displace a real publish.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    || (vars.PRODUCTION_PROMOTION != 'manual'
    && github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.event == 'push'
    && github.event.workflow_run.head_branch == 'master'
    && github.event.workflow_run.head_repository.full_name == github.repository))
    && 'sync-mediprisma-app' || format('sync-mediprisma-app-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # A manual promotion from master's copy of this workflow, or, in automatic
    # mode, a successful CI run of a push to this repository's master.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      || (vars.PRODUCTION_PROMOTION != 'manual'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'
      && github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Checkout master history
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit on master with CI passed (and, by hand, live on staging)
        id: check
        env:
          REQUESTED: ${{ inputs.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            # The event only says that master moved. Which commit to publish is
            # decided in the sync job, at publish time, so no ordering of events,
            # cancelled runs or re-runs can publish anything but the newest.
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "CI passed for master $CI_SHA; publishing the newest master commit that passed CI."
            exit 0
          fi
          echo "mode=manual" >> "$GITHUB_OUTPUT"
          # Written by the staging build itself; the only proof of what testers saw.
          live="$(curl -fsS --retry 3 "https://mediprisma.tw/app-staging/deploy.json?t=$(date +%s)" | jq -r '.appSha // empty')"
          if ! [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then echo "/app-staging does not report its commit."; exit 1; fi
          sha="${REQUESTED:-$live}"
          if [ "$sha" != "$live" ]; then echo "/app-staging is serving $live, not $sha; test that commit first."; exit 1; fi
          if ! git merge-base --is-ancestor "$sha" origin/master; then echo "$sha is not on master."; exit 1; fi
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=master&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$ci" -eq 0 ]; then echo "CI has not passed on master for $sha."; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha: live on /app-staging, on master, CI passed."

  # The approval comes after the checks, so the approver sees which commit passed.
  # Automatic mode has no approval step.
  approve:
    needs: verify
    if: ${{ needs.verify.outputs.mode == 'manual' }}
    runs-on: ubuntu-latest
    # Required reviewers and a master-only branch policy are set on this environment.
    environment: production
    steps:
      - name: Approved
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: echo "Approved promotion of $SHA to /app."

  sync:
    needs: [verify, approve]
    # approve is skipped in automatic mode; in manual mode it must have succeeded.
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success'
      && (needs.approve.result == 'success'
      || (needs.verify.outputs.mode == 'auto' && needs.approve.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: mediprisma-site-publish
    permissions:
      contents: read
      actions: read
    steps:
      # Staging may have moved on while the approval waited: publish only if it
      # still serves the approved commit.
      - name: Recheck that staging still serves the approved commit
        if: ${{ needs.verify.outputs.mode == 'manual' }}
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          live="$(curl -fsS --retry 3 "https://mediprisma.tw/app-staging/deploy.json?t=$(date +%s)" | jq -r '.appSha // empty')"
          if [ "$live" != "$SHA" ]; then echo "/app-staging now serves ${live:-nothing}, not $SHA; start a new promotion."; exit 1; fi

      # Read first: it holds static/app/deploy.json, the record of what /app serves.
      - name: Checkout docs site (mediprisma-site)
        uses: actions/checkout@v7
        with:
          repository: MediPrisma/mediprisma-site
          ssh-key: ${{ secrets.MEDIPRISMA_SITE_DEPLOY_KEY }}
          path: docs-site
          ref: main

      # Automatic mode publishes the newest master commit whose CI passed, looked
      # up now rather than taken from the event, and only if it is ahead of the
      # commit /app already serves. A late, cancelled or re-run event, a re-run
      # of this job, or CI results that change on re-run can therefore never move
      # /app back. Commits CI skips (docs only) are passed over.
      # Manual mode publishes the approved commit as before, rollback included.
      - name: Choose the commit to publish
        id: target
        env:
          MODE: ${{ needs.verify.outputs.mode }}
          APPROVED: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = manual ]; then
            echo "sha=$APPROVED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          candidate=""
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=master&per_page=30" --jq '.[].sha'); do
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=master&event=push&status=success&per_page=1" --jq '.total_count')"
            if [ "$passed" -gt 0 ]; then candidate="$sha"; break; fi
          done
          if [ -z "$candidate" ]; then echo "None of the last 30 master commits has passed CI; nothing to publish."; exit 1; fi
          live="$(jq -r '.appSha // empty' docs-site/static/app/deploy.json 2>/dev/null || true)"
          if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
            relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$live...$candidate" --jq '.status')"
            if [ "$relation" != ahead ]; then
              echo "/app serves $live; $candidate is $relation of it, so nothing newer to publish."
              exit 0
            fi
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Publishing $candidate, the newest master commit that passed CI (live: ${live:-unknown})."

      - name: Checkout the promoted commit
        if: ${{ steps.target.outputs.sha != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: app

      - name: Setup Node
        if: ${{ steps.target.outputs.sha != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        if: ${{ steps.target.outputs.sha != '' }}
        working-directory: app
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build static export for /app (basePath /app, same env as gh-pages)
        if: ${{ steps.target.outputs.sha != '' }}
        working-directory: app
        run: npm run build:mediprisma
        env:
          TAILWIND_DISABLE_LIGHTNINGCSS: "true"
          # Public origin only (no secrets); baked into /app, not a runtime switch.
          NEXT_PUBLIC_COLLECTOR_ORIGIN: ${{ vars.NEXT_PUBLIC_COLLECTOR_ORIGIN }}
          NEXT_PUBLIC_HF_GATEWAY_ORIGIN: ${{ vars.NEXT_PUBLIC_HF_GATEWAY_ORIGIN }}
          NEXT_PUBLIC_HF_AUTH_POLICY: ${{ vars.NEXT_PUBLIC_HF_AUTH_POLICY }}
          NEXT_PUBLIC_CDSS_ADMISSION: ${{ vars.NEXT_PUBLIC_CDSS_ADMISSION }}
          NEXT_PUBLIC_CDSS_API_ORIGIN: ${{ vars.NEXT_PUBLIC_CDSS_API_ORIGIN }}
          NEXT_PUBLIC_FHIR_OAUTH_ISSUER: ${{ vars.NEXT_PUBLIC_FHIR_OAUTH_ISSUER }}
          NEXT_PUBLIC_FHIR_OAUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_FHIR_OAUTH_CLIENT_ID }}
          # Leave unset until the VM lab-report receiver is deployed and verified.
          # Public endpoint only; no fallback to the usage-event Collector.
          NEXT_PUBLIC_LAB_REPORT_INSTITUTION_URL: ${{ vars.NEXT_PUBLIC_LAB_REPORT_INSTITUTION_URL }}
          NEXT_PUBLIC_CHAT_URL: ${{ secrets.NEXT_PUBLIC_CHAT_URL }}
          NEXT_PUBLIC_WHISPER_URL: ${{ secrets.NEXT_PUBLIC_WHISPER_URL }}
          NEXT_PUBLIC_GEMINI_URL: ${{ secrets.NEXT_PUBLIC_GEMINI_URL }}
          NEXT_PUBLIC_CLAUDE_URL: ${{ secrets.NEXT_PUBLIC_CLAUDE_URL }}
          NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL }}
          NEXT_PUBLIC_PROXY_KEY: ${{ secrets.NEXT_PUBLIC_PROXY_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PERPLEXITY_PROXY_URL: ${{ secrets.NEXT_PUBLIC_PERPLEXITY_PROXY_URL }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ secrets.NEXT_PUBLIC_FEEDBACK_URL }}

      # What /app serves, at /app/deploy.json; the next automatic run reads it to
      # refuse anything older.
      - name: Record the built commit
        if: ${{ steps.target.outputs.sha != '' }}
        working-directory: app
        env:
          APP_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          jq -n --arg appSha "$APP_SHA" '{channel: "production", appSha: $appSha}' > out/deploy.json

      - name: Copy build into docs static/app
        if: ${{ steps.target.outputs.sha != '' }}
        run: |
          rm -rf docs-site/static/app
          mkdir -p docs-site/static/app
          cp -r app/out/. docs-site/static/app/

      - name: Commit & push if changed
        if: ${{ steps.target.outputs.sha != '' }}
        working-directory: docs-site
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          git config user.name "mediprisma-app-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/app
          if git diff --cached --quiet; then
            echo "No changes in /app build — nothing to sync."
            exit 0
          fi
          git commit -m "chore: promote /app to mediprisma-app@${SHA:0:7}"

          # The HMC preview and /app-staging publish to this same branch from
          # their own concurrency groups, so they can be in flight together and
          # this push can arrive second. Each touches only its own directory
          # (static/app, static/app-hmc, static/app-staging), so replaying on top
          # of whatever landed first is always clean.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto whatever landed first."
            git pull --rebase origin main
          done
          echo "Could not push /app after three attempts."
          exit 1
