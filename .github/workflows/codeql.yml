name: CodeQL

# Static security analysis for the app's JS/TS source.
# https://docs.github.com/code-security/code-scanning
on:
  push:
    branches: [master]
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
      - "outputs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
      - "outputs/**"
  schedule:
    # Weekly, so newly-disclosed query packs catch existing code too.
    - cron: "27 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript-typescript"
