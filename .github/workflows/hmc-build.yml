name: HMC preview build

# This file belongs to pilot/hmc, and it is the half of the preview HMC owns.
#
# Everything that can decide a build is not fit to show a clinician runs here:
# the personalization build, the overlay, the overlay's own smoke check,
# typecheck, lint, Jest, and the static export. When one of them is wrong —
# the way the overlay check kept demanding the CKD pack on 2026-09-10, days
# after the release that dropped it — the fix is a commit on this branch, by
# whoever is blocked, without waiting for the app owner.
#
# Publishing is deliberately not here. The key that writes mediprisma.tw is an
# environment secret restricted to protected branches, so this branch cannot
# read it however this file is edited. `Publish HMC pilot preview` on master
# waits for this run to finish, takes the artifact, and copies it into
# /app-hmc and nowhere else.
#
# What this run produces is therefore the whole contract: `out/` as built, and
# `hmc-build.json` naming the two commits it was built from. A red Jest run is
# recorded in `test-summary.txt` and does not stop the upload — it is reported
# on the other side, in the issue, not used as a gate.
on:
  push:
    branches:
      - pilot/hmc
    tags:
      - hmc-personalization-trigger
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hmc-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout HMC app source
        uses: actions/checkout@v7
        with:
          # The commit that started this run, not whatever the branch points at
          # by the time the checkout happens. Those differ when a second push
          # lands while this one is still starting, and then the build would
          # record a commit the run was not built from — which the publisher
          # refuses, correctly, and the preview would stall for a reason nobody
          # could see.
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false

      - name: Checkout HMC personalization source
        uses: actions/checkout@v7
        with:
          repository: voho0000/mediprisma-personalization
          ref: pilot/hmc
          ssh-key: ${{ secrets.HMC_PERSONALIZATION_DEPLOY_KEY }}
          path: personalization
          persist-credentials: false

      - name: Resolve pilot revisions
        id: revisions
        shell: bash
        run: |
          echo "app_sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "personalization_sha=$(git -C personalization rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            personalization/package-lock.json

      - name: Check owner-set HF gateway variables
        env:
          NEXT_PUBLIC_HF_GATEWAY_ORIGIN: ${{ vars.NEXT_PUBLIC_HF_GATEWAY_ORIGIN }}
          NEXT_PUBLIC_HF_AUTH_POLICY: ${{ vars.NEXT_PUBLIC_HF_AUTH_POLICY }}
        shell: bash
        run: |
          # Diagnose owner-controlled configuration early without blocking
          # unrelated pilot deployments when HF configuration is unavailable.
          node --input-type=module <<'NODE'
          const warn = message => console.log(`::warning title=HF configuration requires repository owner action::${message}`)
          const origin = process.env.NEXT_PUBLIC_HF_GATEWAY_ORIGIN
          const policy = process.env.NEXT_PUBLIC_HF_AUTH_POLICY
          if (!origin) {
            warn('Set repository variable NEXT_PUBLIC_HF_GATEWAY_ORIGIN; HF prediction will remain disabled until the next configured build.')
          } else {
            try {
              const url = new URL(origin)
              if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/') throw new Error('Invalid origin')
            } catch {
              warn('NEXT_PUBLIC_HF_GATEWAY_ORIGIN must be an HTTPS origin; HF prediction will remain disabled until the next configured build.')
            }
          }
          if (!['firebase', 'intranet'].includes(policy)) {
            warn('Set repository variable NEXT_PUBLIC_HF_AUTH_POLICY explicitly to firebase or intranet; an omitted policy uses the runtime Firebase default.')
          }
          NODE

      - name: Align personalization source workspace versions
        working-directory: personalization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const packageRoot = path.resolve('packages')
          const directories = await readdir(packageRoot, { withFileTypes: true })
          const manifests = []
          const versions = new Map()

          for (const directory of directories.filter((entry) => entry.isDirectory())) {
            const manifestPath = path.join(packageRoot, directory.name, 'package.json')
            const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            manifests.push({ manifestPath, manifest })
            versions.set(manifest.name, manifest.version)
          }

          for (const { manifestPath, manifest } of manifests) {
            for (const section of ['dependencies', 'devDependencies', 'peerDependencies']) {
              for (const dependency of Object.keys(manifest[section] ?? {})) {
                if (versions.has(dependency)) manifest[section][dependency] = versions.get(dependency)
              }
            }
            await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - name: Install personalization dependencies from source workspaces
        working-directory: personalization
        shell: bash
        run: |
          cleanup_npmrc() {
            rm -f .npmrc
          }
          trap cleanup_npmrc EXIT
          rm -f .npmrc
          printf '%s\n' 'registry=https://registry.npmjs.org/' > .npmrc
          npm install --ignore-scripts --package-lock=false

      - name: Rebuild personalization dependencies
        working-directory: personalization
        run: npm rebuild

      - name: Verify and build HMC personalization
        working-directory: personalization
        run: npm run verify

      - name: Remove published source packages from app roots
        working-directory: app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const sourcePackageRoot = path.resolve('..', 'personalization', 'packages')
          const sourceDirectories = await readdir(sourcePackageRoot, { withFileTypes: true })
          const localPackages = []

          for (const directory of sourceDirectories.filter((entry) => entry.isDirectory())) {
            const manifestPath = path.join(sourcePackageRoot, directory.name, 'package.json')
            const sourceManifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            if (!sourceManifest.name?.startsWith('@voho0000/')) {
              throw new Error(`Unexpected source package name at ${manifestPath}: ${sourceManifest.name}`)
            }
            localPackages.push(sourceManifest.name)
          }
          if (localPackages.length === 0) throw new Error('No personalization source packages found')

          const manifest = JSON.parse(await readFile('package.json', 'utf8'))
          const lockfile = JSON.parse(await readFile('package-lock.json', 'utf8'))

          for (const name of localPackages) {
            // Retain the published dependency during npm ci; the complete pilot
            // source package replaces it in the injection step below.
            if (name === '@voho0000/personalized-care') continue
            delete manifest.dependencies?.[name]
            delete manifest.devDependencies?.[name]
            delete lockfile.packages?.['']?.dependencies?.[name]
            delete lockfile.packages?.['']?.devDependencies?.[name]
          }

          await writeFile('package.json', `${JSON.stringify(manifest, null, 2)}\n`)
          await writeFile('package-lock.json', `${JSON.stringify(lockfile, null, 2)}\n`)
          NODE

      - name: Install app dependencies
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        shell: bash
        run: |
          cleanup_npmrc() {
            rm -f .npmrc
          }
          trap cleanup_npmrc EXIT
          rm -f .npmrc
          printf '%s\n' \
            '@voho0000:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            'registry=https://registry.npmjs.org/' > .npmrc
          npm ci --ignore-scripts

      - name: Rebuild app dependencies
        working-directory: app
        run: npm rebuild

      - name: Inject HMC personalization source packages
        env:
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
          PERSONALIZATION_SHA: ${{ steps.revisions.outputs.personalization_sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { access, cp, mkdir, readdir, readFile, rm, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const packageRoot = path.resolve('personalization', 'packages')
          const packageDirs = (await readdir(packageRoot, { withFileTypes: true }))
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort()
          if (packageDirs.length === 0) throw new Error('No personalization source packages found')

          // Use the complete pilot build, including its disease and knowledge
          // registries. A partial HF overlay would omit the dyslipidemia pack.
          const packageVersions = {}

          for (const packageDir of packageDirs) {
            const source = path.join(packageRoot, packageDir)
            const manifest = JSON.parse(await readFile(path.join(source, 'package.json'), 'utf8'))
            const expectedName = `@voho0000/${packageDir}`
            if (manifest.name !== expectedName) {
              throw new Error(`Unexpected package name at ${source}: ${manifest.name}`)
            }
            await access(path.join(source, 'dist', 'index.js'))

            const target = path.resolve('app', 'node_modules', '@voho0000', packageDir)
            await rm(target, { recursive: true, force: true })
            await mkdir(target, { recursive: true })
            await cp(path.join(source, 'package.json'), path.join(target, 'package.json'))
            await cp(path.join(source, 'dist'), path.join(target, 'dist'), { recursive: true })
            packageVersions[manifest.name] = manifest.version
          }

          const buildInfo = {
            preview: 'HMC',
            appRef: 'pilot/hmc',
            appSha: process.env.APP_SHA,
            personalizationRef: 'pilot/hmc',
            personalizationSha: process.env.PERSONALIZATION_SHA,
            packageVersions,
            builtAt: new Date().toISOString(),
          }
          await writeFile(
            path.resolve('app', 'public', 'hmc-build.json'),
            `${JSON.stringify(buildInfo, null, 2)}\n`,
          )
          NODE

      - name: Verify HMC care overlay
        working-directory: app
        shell: bash
        run: |
          node <<'NODE'
          const { CARE_PACKS } = require('@voho0000/personalized-care')
          const { HEART_FAILURE_GUIDELINE_PACK: sourceHeartFailure } = require(
            '../personalization/packages/personalized-care/dist/guideline-packs/heart-failure-pack.js'
          )

          const { HYPERLIPIDEMIA_GUIDELINE_PACK: sourceLipid } = require(
            '../personalization/packages/personalized-care/dist/guideline-packs/hyperlipidemia-pack.js'
          )
          const installedLipid = CARE_PACKS.find((pack) => pack.id === 'hyperlipidemia-cdss')
          if (!installedLipid || installedLipid.version !== sourceLipid.version) {
            throw new Error('HMC overlay must include the pilot dyslipidemia pack')
          }
          const { getEnabledKnowledgePacks } = require('@voho0000/personalized-care')
          if (!getEnabledKnowledgePacks().some((pack) => pack.metadata('zh-TW').id === 'taiwan-nhi-lipid-2026')) {
            throw new Error('HMC overlay must include NHI lipid evidence')
          }
          const installedHeartFailure = CARE_PACKS.find((pack) => pack.id === 'heart-failure-cdss')
          if (!installedHeartFailure) {
            throw new Error('HMC overlay must retain the heart-failure care pack')
          }
          for (const field of ['id', 'version', 'enabled']) {
            if (installedHeartFailure[field] !== sourceHeartFailure[field]) {
              throw new Error(`HMC heart-failure ${field} does not match pilot source`)
            }
          }
          if (installedHeartFailure.label.zh !== sourceHeartFailure.label.zh
            || installedHeartFailure.label.en !== sourceHeartFailure.label.en) {
            throw new Error('HMC heart-failure label does not match pilot source')
          }
          NODE

      - name: Typecheck HMC app
        working-directory: app
        run: npx tsc --noEmit

      - name: Lint HMC app
        working-directory: app
        run: npm run lint

      # Reported, not gating. What has to be true before a build reaches a
      # clinician is that the preview runs at all, and the steps around this one
      # say so: the overlay check, typecheck, lint and the export each fail on
      # something genuinely broken. A red Jest run means the repository is not
      # clean, which is worth knowing and is not the same claim — so it travels
      # to the publisher in `test-summary.txt` and is reported in the issue
      # while the preview still goes out.
      #
      # This distinction cost a day on 2026-09-10, when four cases that could
      # never pass in a preview build held back the whole HFpEF slice. Both
      # halves of that are now fixable from this branch: the suite, and this
      # step.
      #
      # The three ignored suites assert the released package's HF title and
      # pilot gate, which this branch's source intentionally replaces; the
      # personalization repository's own verify run and the overlay check above
      # cover that boundary.
      - name: Test HMC app
        id: tests
        working-directory: app
        continue-on-error: true
        shell: bash
        run: |
          # `shell: bash` already runs with -eo pipefail, so the tee below does
          # not swallow a failing run.
          npm test -- --ci --passWithNoTests --testPathIgnorePatterns="worktrees|__tests__/features/clinical-decision-support/(LiveFeature|package-wiring|pilot-pack-registry)[.]test[.]tsx?$" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      - name: Record the test result for the publisher
        if: always()
        shell: bash
        run: |
          # Jest colours its own output whether or not a terminal is attached,
          # so strip the escapes before matching on line starts.
          perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/test-output.txt" > plain.txt
          {
            echo "outcome=${{ steps.tests.outcome }}"
            grep -E '^(Test Suites|Tests):' plain.txt || true
            # Coloured output leaves ` FAIL ` padded once the escapes are gone.
            grep -E '^ *FAIL +' plain.txt | sed -E 's/^ *FAIL +/FAIL /' | sort -u | head -20 || true
          } > test-summary.txt
          cat test-summary.txt

      - name: Build static HMC preview
        working-directory: app
        env:
          DEPLOY_BASE_PATH: "/app-hmc"
          TAILWIND_DISABLE_LIGHTNINGCSS: "true"
          NEXT_PUBLIC_COLLECTOR_ORIGIN: ${{ vars.NEXT_PUBLIC_COLLECTOR_ORIGIN }}
          NEXT_PUBLIC_HF_GATEWAY_ORIGIN: ${{ vars.NEXT_PUBLIC_HF_GATEWAY_ORIGIN }}
          NEXT_PUBLIC_HF_AUTH_POLICY: ${{ vars.NEXT_PUBLIC_HF_AUTH_POLICY }}
          NEXT_PUBLIC_CDSS_ADMISSION: ${{ vars.NEXT_PUBLIC_CDSS_ADMISSION }}
          NEXT_PUBLIC_CDSS_API_ORIGIN: ${{ vars.NEXT_PUBLIC_CDSS_API_ORIGIN }}
          NEXT_PUBLIC_CHAT_URL: ${{ vars.NEXT_PUBLIC_CHAT_URL }}
          NEXT_PUBLIC_WHISPER_URL: ${{ vars.NEXT_PUBLIC_WHISPER_URL }}
          NEXT_PUBLIC_GEMINI_URL: ${{ vars.NEXT_PUBLIC_GEMINI_URL }}
          NEXT_PUBLIC_CLAUDE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_URL }}
          NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_OPENAI_COMPATIBLE_GATEWAY_URL }}
          NEXT_PUBLIC_PROXY_KEY: ${{ vars.NEXT_PUBLIC_PROXY_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_APPCHECK_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_PERPLEXITY_PROXY_URL: ${{ vars.NEXT_PUBLIC_PERPLEXITY_PROXY_URL }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_URL }}
        shell: bash
        run: |
          restore_api() {
            if [ -d .api-stash-hmc-build ]; then
              mv .api-stash-hmc-build app/api
            fi
          }
          trap restore_api EXIT
          if [ -d app/api ]; then
            mv app/api .api-stash-hmc-build
          fi
          npx next build

      - name: Refuse to hand over a link that could escape /app-hmc
        shell: bash
        run: |
          # The publisher copies this tree into the site repository. A symlink
          # in it would be copied as a link and could point outside the
          # directory, so the tree has to be plain files before it leaves here.
          links="$(find app/out -type l)"
          if [ -n "$links" ]; then
            echo "Static export contains symlinks:"
            echo "$links"
            exit 1
          fi

      - name: Upload the preview for the publisher
        uses: actions/upload-artifact@v7
        with:
          name: hmc-preview
          path: |
            app/out/
            test-summary.txt
          if-no-files-found: error
          retention-days: 1
